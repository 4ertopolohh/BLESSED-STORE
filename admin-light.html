button, a.btn, input, select, textarea, .choice-trigger {
  transition: background-color .18s, border-color .18s, color .18s, box-shadow .18s, transform .18s var(--ease);
}
button:not(:disabled):active, a.btn:active { transform: translateY(1px); }
tbody tr { transition: background-color .18s; }
tbody tr:hover, tbody tr:focus-within { background: var(--store-control); }
input:is([type=checkbox],[type=radio]) { accent-color: var(--accent); }
select:not([multiple]) { appearance: none; padding-inline-end: 34px; cursor: pointer; }
.select-shell { position: relative; display: inline-grid; min-width: 0; max-width: 100%; }
.select-shell > svg { position: absolute; pointer-events: none; right: 10px; top: 50%; width: 15px; transform: translateY(-50%); color: var(--accent); }
.select-shell select { width: 100%; }
@supports (appearance: base-select) {
  select:not([multiple]), select::picker(select) { appearance: base-select; }
  select::picker-icon { display: none; }
  select::picker(select) {
    background: var(--panel); color: var(--ink); border:0; border-radius:var(--radius);
    padding: 4px; margin-block: 5px; max-height: min(55dvh, 310px); overflow: auto;
    box-shadow: 0 12px 28px color-mix(in srgb,var(--bg) 47%,transparent);
  }
  select::picker(select):popover-open { animation: picker-in .17s var(--ease); }
  option { padding: 8px 10px; border-radius:var(--radius); }
  option:is(:hover,:focus-visible) { background: var(--line); }
  option:checked { color: var(--ink); }
  .select-shell:has(select:open) > svg { transform: translateY(-50%) rotate(180deg); }
}
.select-shell > svg, .choice-trigger > svg { transition: transform .2s var(--ease); }
.choice-trigger { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; width: 100%; }
.choice-trigger > span:first-child { flex: 1; }
.choice-count { color: var(--accent); font-variant-numeric: tabular-nums; }
.choice-trigger > svg { width: 15px; color: var(--accent); }
.choice-trigger[aria-expanded=true] > svg { transform: rotate(180deg); }
.choice-menu {
  position: absolute; z-index: 2; top: calc(100% + 5px); inset-inline: 0; padding: 5px;
  border:0; border-radius:var(--radius); background: var(--panel); box-shadow: 0 12px 28px color-mix(in srgb,var(--bg) 47%,transparent);
  max-height: min(42dvh, 260px); overflow: auto;
}
.choice-menu:not([hidden]) { animation: picker-in .17s var(--ease); }
.choice-menu label { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius:var(--radius); cursor: pointer; color: var(--ink); }
.choice-menu label:is(:hover,:focus-within) { background: var(--line); }
.toast:not(:empty) { animation: toast-in .22s var(--ease); }
dialog::backdrop { animation: backdrop-in .2s ease-out; }
@keyframes picker-in { from { opacity: 0; transform: translateY(-4px); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes backdrop-in { from { opacity: 0; } }

let choiceSequence = 0;

function enhanceSelectors(root) {
  for (const select of root.querySelectorAll('select')) {
    if (select.closest('.select-shell')) continue;

    const shell = document.createElement('span');
    shell.className = 'select-shell';
    select.before(shell);
    shell.append(select);

    if (!select.multiple) {
      shell.insertAdjacentHTML('beforeend', icons.chevron);
      continue;
    }

    const label = select.labels[0];
    const caption = label?.firstChild.textContent.trim() || 'Выбор';
    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'choice-trigger';
    trigger.setAttribute('aria-expanded', 'false');

    const menu = document.createElement('span');
    menu.className = 'choice-menu';
    menu.id = 'choice-menu-' + (++choiceSequence);
    menu.hidden = true;
    menu.setAttribute('role', 'group');
    menu.setAttribute('aria-label', caption);
    trigger.setAttribute('aria-controls', menu.id);
    // The select remains the form value source.
    if (label) label.replaceWith(shell);
    select.hidden = true;
    shell.append(trigger, menu);

    function updateSummary() {
      const count = select.selectedOptions.length;
      const title = document.createElement('span');
      const badge = document.createElement('span');
      title.textContent = caption;
      badge.className = 'choice-count';
      badge.textContent = String(count);
      trigger.replaceChildren(title, badge);
      trigger.setAttribute('aria-label', caption + '. Выбрано: ' + count);
    }

    function setOpen(open) {
      menu.hidden = !open;
      trigger.setAttribute('aria-expanded', String(open));
    }

    for (const option of select.options) {
      const row = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = option.selected;
      checkbox.disabled = option.disabled;
      checkbox.addEventListener('change', () => {
        option.selected = checkbox.checked;
        updateSummary();
        select.dispatchEvent(new Event('change', { bubbles: true }));
      });
      row.append(checkbox, option.textContent);
      menu.append(row);
    }

    trigger.addEventListener('click', () => {
      setOpen(menu.hidden);
      if (!menu.hidden) menu.querySelector('input:not(:disabled)')?.focus();
    });
    shell.addEventListener('focusout', event => {
      if (!shell.contains(event.relatedTarget)) setOpen(false);
    });
    shell.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || menu.hidden) return;
      event.stopPropagation();
      setOpen(false);
      trigger.focus();
    });
    updateSummary();
  }
}

const themeSwitch = document.querySelector('#theme-toggle');
function applyAdminTheme(theme) {
  document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
  themeSwitch.setAttribute('aria-pressed', String(theme === 'dark'));
  redrawChart?.();
}
applyAdminTheme(document.documentElement.dataset.theme);
themeSwitch.addEventListener('click', () => {
  const theme = themeSwitch.getAttribute('aria-pressed') === 'true' ? 'light' : 'dark';
  applyAdminTheme(theme);
  try { localStorage.setItem('blessed.lightTheme', theme); } catch {}
});
window.addEventListener('storage', event => {
  if (event.key === 'blessed.lightTheme') applyAdminTheme(event.newValue);
});
